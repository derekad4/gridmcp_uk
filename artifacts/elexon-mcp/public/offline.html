<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Offline · Grid MCP</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8f6f1; color: #151e32; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 1.25rem 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #5b6170; line-height: 1.5; }
      button { border: 0; border-radius: 8px; padding: 0.7rem 1.2rem; background: #1f704b; color: #fcfbf8; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Grid MCP needs a connection for live market data, Ask and health checks. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
